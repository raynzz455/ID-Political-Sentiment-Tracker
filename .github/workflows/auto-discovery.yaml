name: Weekly Entity Auto-Discovery + Enrichment

on:
  schedule:
    # Tiap Minggu jam 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  run-discovery:
    name: Run Auto Discovery + Enrichment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Discover
        run: python -m packages.entity_discovery.auto_discover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Run Entity Enrichment
        run: python -m packages.entity_discovery.enrich_entities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
