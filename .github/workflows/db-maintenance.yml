name: 3. DB Maintenance (Weekly Cleanup + VACUUM)

on:
  schedule:
    # Setiap Minggu jam 02:00 UTC (09:00 WIB) — di luar jam sibuk ingestion
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  run-db-maintenance:
    name: Weekly DB Cleanup & VACUUM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # psycopg2 optional untuk VACUUM — install kalau DATABASE_URL ada
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL detected — installing psycopg2-binary"
            pip install psycopg2-binary
          else
            echo "DATABASE_URL not set — VACUUM will be skipped"
          fi

      - name: Run Weekly DB Maintenance
        run: python packages/db/maintenance_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
