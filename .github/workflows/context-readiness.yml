name: 2c. Context Worker + NLP Readiness

on:
  schedule:
    # 30 menit setelah entity resolution selesai
    - cron: '35 1 * * *'   # 01:35 UTC (08:35 WIB)
    - cron: '40 6 * * *'   # 06:40 UTC (13:40 WIB)
    - cron: '40 11 * * *'  # 11:40 UTC (18:40 WIB)
    - cron: '0 17 * * *'   # 17:00 UTC (00:00 WIB)

  workflow_dispatch:

jobs:
  run-context-readiness:
    name: Run Context Worker + NLP Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Paling berat: Stanza + relevancy model + KeyBERT

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Context Worker
        run: python main.py run-worker context --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIGHTWEIGHT_MODE: "1"  # v20: skip Stanza, use regex (100x faster on CPU)
          NLP_SENTIMENT_MODEL: ${{ vars.NLP_SENTIMENT_MODEL }}
          NLP_RELEVANCY_MODEL: ${{ vars.NLP_RELEVANCY_MODEL }}

      - name: Run NLP Readiness Worker
        run: python main.py run-worker readiness --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
