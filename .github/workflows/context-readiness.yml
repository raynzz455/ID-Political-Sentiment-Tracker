name: 2c. Context Worker + NLP Readiness

on:
  schedule:
    # 30 menit setelah entity resolution selesai
    - cron: '35 1 * * *'   # 01:35 UTC (08:35 WIB)
    - cron: '40 6 * * *'   # 06:40 UTC (13:40 WIB)
    - cron: '40 11 * * *'  # 11:40 UTC (18:40 WIB)
    - cron: '0 17 * * *'   # 17:00 UTC (00:00 WIB)

  workflow_dispatch:

jobs:
  run-context-readiness:
    name: Run Context Worker + NLP Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35  # Stanza + relevancy model + sentence-transformers

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # cache pip downloads

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Stanza models (~500MB) — first run downloads, subsequent runs use cache
      - name: Cache Stanza Models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-id-models-v1
          restore-keys: |
            stanza-id-models-

      # Cache HuggingFace models (relevancy + sentiment + fallback = ~1.3GB)
      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-context-v1
          restore-keys: |
            hf-models-

      - name: Run Context Worker
        run: python main.py run-worker context --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # FULL NLP MODE — Stanza aktif untuk akurasi maksimal.
          # Context worker v18 needs Stanza for:
          #   - sentence tokenization (accurate, not regex)
          #   - POS tagging (subject/object detection)
          #   - dependency parsing (semantic role → kills speaker_not_target bias)
          # Relevancy model pre-filters spans → removes background noise.
          # With 4-core CPU + model cache, 200 articles / 4 threads = ~6 min.
          LIGHTWEIGHT_MODE: "0"
          MAX_NLP_WORKERS: "4"
          NLP_SENTIMENT_MODEL: ${{ vars.NLP_SENTIMENT_MODEL }}
          NLP_RELEVANCY_MODEL: ${{ vars.NLP_RELEVANCY_MODEL }}

      - name: Run NLP Readiness Worker
        run: python main.py run-worker readiness --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
