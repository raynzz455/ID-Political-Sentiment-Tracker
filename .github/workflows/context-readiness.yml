name: 2c. Context Worker (Stanza NLP)

on:
  schedule:
    # 30 menit setelah entity resolution selesai
    - cron: '35 1 * * *'   # 01:35 UTC (08:35 WIB)
    - cron: '40 6 * * *'   # 06:40 UTC (13:40 WIB)
    - cron: '40 11 * * *'  # 11:40 UTC (18:40 WIB)
    - cron: '0 17 * * *'   # 17:00 UTC (00:00 WIB)

  workflow_dispatch:

jobs:
  run-context-worker:
    name: Run Context Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Stanza + relevancy model, batch 150

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Stanza Models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-id-models-v1
          restore-keys: |
            stanza-id-models-

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-context-v1
          restore-keys: |
            hf-models-

      - name: Run Context Worker
        run: python main.py run-worker context --limit 150
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # FULL NLP MODE — Stanza aktif untuk akurasi maksimal.
          # Context worker v18 needs Stanza for dependency parsing
          # (kills speaker_not_target bias).
          LIGHTWEIGHT_MODE: "0"
          MAX_NLP_WORKERS: "4"
          # Extend lookback — match entity resolution (180d) supaya articles
          # yang baru di-resolve (dari backlog 6078) bisa di-extract context
          DAYS_BACK: "180"
          NLP_SENTIMENT_MODEL: ${{ vars.NLP_SENTIMENT_MODEL }}
          NLP_RELEVANCY_MODEL: ${{ vars.NLP_RELEVANCY_MODEL }}
