name: 2b. Entity Resolution (Stanza NLP)

on:
  schedule:
    # 30 menit setelah light prep selesai
    - cron: '5 1 * * *'   # 01:05 UTC (08:05 WIB)
    - cron: '10 6 * * *'  # 06:10 UTC (13:10 WIB)
    - cron: '10 11 * * *' # 11:10 UTC (18:10 WIB)
    - cron: '30 16 * * *' # 16:30 UTC (23:30 WIB)

  workflow_dispatch:

jobs:
  run-entity-resolution:
    name: Run Entity Resolution Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Stanza NLP, sedang

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Entity Resolution Worker
        run: python main.py run-worker entity --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIGHTWEIGHT_MODE: "1"  # v20: skip Stanza, regex-based PROPN detection
