name: 2b. Entity Resolution (Stanza NLP)

on:
  schedule:
    # 30 menit setelah light prep selesai
    - cron: '5 1 * * *'   # 01:05 UTC (08:05 WIB)
    - cron: '10 6 * * *'  # 06:10 UTC (13:10 WIB)
    - cron: '10 11 * * *' # 11:10 UTC (18:10 WIB)
    - cron: '30 16 * * *' # 16:30 UTC (23:30 WIB)

  workflow_dispatch:

jobs:
  run-entity-resolution:
    name: Run Entity Resolution Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Stanza NLP + model cache

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # cache pip downloads

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Stanza models (~500MB) — first run downloads, subsequent runs use cache
      # Stanza downloads to ~/stanza_resources/ by default
      - name: Cache Stanza Models
        uses: actions/cache@v4
        with:
          path: ~/stanza_resources
          key: stanza-id-models-v1
          restore-keys: |
            stanza-id-models-

      # Cache HuggingFace models (~440MB each) — avoids re-download every run
      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-entity-v1
          restore-keys: |
            hf-models-

      - name: Run Entity Resolution Worker
        run: python main.py run-worker entity --limit 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # FULL NLP MODE — Stanza aktif untuk akurasi maksimal.
          # Stanza provides: tokenize, pos, lemma, depparse → semantic role detection.
          # Regex lightweight mode (LIGHTWEIGHT_MODE=1) only does PROPN matching →
          # misses grammatical roles → 66% false-positive on main entity.
          # With 4-core CPU + model cache, 200 articles / 4 threads = ~4 min.
          LIGHTWEIGHT_MODE: "0"
          MAX_NLP_WORKERS: "4"
