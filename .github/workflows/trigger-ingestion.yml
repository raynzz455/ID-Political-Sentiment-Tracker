name: RSS Backup, GNews, DDG & Enricher

on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '19 5 * * *'
    - cron: '23 10 * * *'
    - cron: '41 15 * * *'
  workflow_dispatch:
jobs:
  trigger-rss:
    name: Trigger RSS Deno
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function (with retry)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EDGE_FUNCTION_URL: ${{ secrets.SUPABASE_EDGE_FUNCTION_URL }}
        run: |
          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -o /tmp/rss_response.txt -w "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --header "x-cron-secret: $CRON_SECRET" \
              --max-time 30 \
              "$EDGE_FUNCTION_URL")
            
            echo "HTTP Status: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ RSS Deno triggered successfully"
              exit 0
            fi
            
            echo "⚠️ Failed (HTTP $HTTP_STATUS). Response:"
            cat /tmp/rss_response.txt 2>/dev/null || echo "(no response body)"
            
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              WAIT=$((attempt * 10))
              echo "Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done
          
          echo "❌ RSS Deno failed after $MAX_RETRIES attempts"
          echo "This is non-blocking — GNews/DDG fetcher will still run"
          exit 0  # Don't fail the whole workflow

  run-fetchers:
    name: Run GNews & DDG Fetcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: pip install -r requirements.txt # Ini di root folder
      - name: Run GNews Fetcher
        run: python -m packages.ingestion.gnews_fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run DDG Fetcher
        run: python -m packages.ingestion.ddg_fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}