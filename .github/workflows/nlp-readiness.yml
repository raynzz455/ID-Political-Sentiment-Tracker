name: 2d. NLP Readiness (Queue for NLP)

on:
  schedule:
    # 25 menit setelah context worker mulai (context worker ~20 min dengan batch 150)
    - cron: '0 2 * * *'   # 02:00 UTC (09:00 WIB)
    - cron: '5 7 * * *'   # 07:05 UTC (14:05 WIB)
    - cron: '5 12 * * *'  # 12:05 UTC (19:05 WIB)
    - cron: '25 17 * * *' # 17:25 UTC (00:25 WIB)

  workflow_dispatch:

jobs:
  run-nlp-readiness:
    name: Run NLP Readiness Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Ringan — quality check + queue, no Stanza/torch

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NLP Readiness Worker
        run: python main.py run-worker readiness --limit 150
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
