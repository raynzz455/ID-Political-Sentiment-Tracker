name: 4b. GNews Local Resolver (Playwright)

on:
  schedule:
    # Tiap 6 jam (02:00, 08:00, 14:00, 20:00 UTC)
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  run-playwright-resolver:
    name: Run GNews Local Resolver (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright untuk headless browser scraping
          pip install playwright
          playwright install chromium --with-deps

      - name: Run GNews Local Resolver
        run: |
          python devtools/recovery/gnews_local_resolver.py --limit 50 --concurrency 3 --timeout 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
